name: Test Login Flow Nuage

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Tester Login Flow v2 Nextcloud
        run: |
          test_login_flow() {
            echo ""
            echo "===== $1 ====="
            timeout 25s curl -4 -sS -v -L \
              -X POST \
              --connect-timeout 8 \
              --max-time 20 \
              -H "User-Agent: OutilsEPS-TestLoginFlow/1.0" \
              -H "Accept: application/json" \
              -w "\nRESULT http=%{http_code} ip=%{remote_ip} connect=%{time_connect} total=%{time_total} redirect=%{num_redirects} final_url=%{url_effective} error=%{errormsg}\n" \
              "$2/index.php/login/v2" || true
          }

          test_login_flow "Nuage01" "https://nuage01.apps.education.fr"
          test_login_flow "Nuage03" "https://nuage03.apps.education.fr"
          test_login_flow "Nuage04" "https://nuage04.apps.education.fr"
