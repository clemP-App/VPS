name: Test Nuage

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test connexions sortantes
        run: |
          test_url() {
            echo ""
            echo "===== $1 ====="
            timeout 15s curl -4 -I -sS -v \
              --connect-timeout 8 \
              --max-time 12 \
              -w "\nRESULT http=%{http_code} ip=%{remote_ip} connect=%{time_connect} total=%{time_total} error=%{errormsg}\n" \
              "$2" || true
          }

          test_url "Google" "https://www.google.com/generate_204"
          test_url "Portail Apps Education" "https://portail.apps.education.fr/"
          test_url "Nextcloud temoin" "https://nextcloud.com/"
          test_url "Nuage01" "https://nuage01.apps.education.fr/status.php"
          test_url "Nuage03" "https://nuage03.apps.education.fr/status.php"
          test_url "Nuage04" "https://nuage04.apps.education.fr/status.php"
